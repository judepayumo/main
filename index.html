<head>

  <style>
    :root {
      --bg: #f8f7f4;
      --text: #1a1a1a;
      --text-muted: #5c5c5c;
      --accent: #1a1a1a;
      --button-bg: #ffffff;
      --button-border: #e5e2dc;
      --button-hover: #1a1a1a;
      --button-hover-text: #ffffff;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e8e4dc, #d4cfc5);
      margin: 0 auto 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      font-weight: 600;
      color: #3d3a35;
      letter-spacing: -0.02em;
      box-shadow: var(--shadow);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

   .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #8a8680;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 1.1rem 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #d4d0c8;
    }

    .divider:not(:empty)::before {
      margin-right: 0.85rem;
    }

    .divider:not(:empty)::after {
      margin-left: 0.85rem;
    }

    .tagline {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      padding: 0.95rem 1.5rem;
      background: var(--button-bg);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid var(--button-border);
      border-radius: 12px;
      transition: all 0.25s ease;
      box-shadow: var(--shadow);
      letter-spacing: 0.01em;
    }

    .link-btn:hover {
      background: var(--button-hover);
      color: var(--button-hover-text);
      border-color: var(--button-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .link-btn:active {
      transform: translateY(0);
    }

    .link-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* Subtle entrance animation */
    .container {
      animation: fadeUp 0.7s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.75rem;
      }
      .avatar {
        width: 84px;
        height: 84px;
        font-size: 2rem;
      }
    }

    .button-row {
      display: flex;
      gap: 0.6rem;
      width: 100%;
      }

    .button-row .link-btn {
      flex: 1;
      padding: 0.85rem 0.5rem;
      font-size: 0.875rem;
    }
  </style>
</head>
